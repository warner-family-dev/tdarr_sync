name: Container image

on:
  pull_request:
    branches:
      - main
      - "dev/**"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image_meta
        shell: bash
        run: |
          echo "published_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cs "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "git_version=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: tdarr-sync:pr
          build-args: |
            APP_IMAGE_TAG=pr
            APP_IMAGE_PUBLISHED_DATE=${{ steps.image_meta.outputs.published_date }}
            APP_IMAGE_REVISION=${{ steps.image_meta.outputs.revision }}
            APP_GIT_VERSION=${{ steps.image_meta.outputs.git_version }}
            APP_GIT_COMMIT_DATE=${{ steps.image_meta.outputs.commit_date }}

      - name: Build and push latest image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/warner-family-dev/tdarr_sync:latest
          build-args: |
            APP_IMAGE_TAG=latest
            APP_IMAGE_PUBLISHED_DATE=${{ steps.image_meta.outputs.published_date }}
            APP_IMAGE_REVISION=${{ steps.image_meta.outputs.revision }}
            APP_GIT_VERSION=${{ steps.image_meta.outputs.git_version }}
            APP_GIT_COMMIT_DATE=${{ steps.image_meta.outputs.commit_date }}

      - name: Build and push release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/warner-family-dev/tdarr_sync:${{ github.ref_name }}
            ghcr.io/warner-family-dev/tdarr_sync:latest
          build-args: |
            APP_IMAGE_TAG=${{ github.ref_name }}
            APP_IMAGE_PUBLISHED_DATE=${{ steps.image_meta.outputs.published_date }}
            APP_IMAGE_REVISION=${{ steps.image_meta.outputs.revision }}
            APP_GIT_VERSION=${{ steps.image_meta.outputs.git_version }}
            APP_GIT_COMMIT_DATE=${{ steps.image_meta.outputs.commit_date }}

  arch_tags:
    name: Publish architecture tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            prefix: amd64
          - platform: linux/arm64
            prefix: arm64v8
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image_meta
        shell: bash
        run: |
          echo "published_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cs "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "git_version=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/warner-family-dev/tdarr_sync:${{ matrix.prefix }}-${{ github.ref_name }}
          build-args: |
            APP_IMAGE_TAG=${{ matrix.prefix }}-${{ github.ref_name }}
            APP_IMAGE_PUBLISHED_DATE=${{ steps.image_meta.outputs.published_date }}
            APP_IMAGE_REVISION=${{ steps.image_meta.outputs.revision }}
            APP_GIT_VERSION=${{ steps.image_meta.outputs.git_version }}
            APP_GIT_COMMIT_DATE=${{ steps.image_meta.outputs.commit_date }}
