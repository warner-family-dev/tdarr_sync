services:
  tdarr-sync:
    image: ghcr.io/warner-family-dev/tdarr_sync:${IMAGE_TAG:-latest}
    # Uncomment to force a platform, for example on a 64-bit Raspberry Pi:
    # platform: ${DOCKER_PLATFORM:-linux/arm64}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STATE_DB_FILE: ${STATE_DB_FILE:-/config/sonarr_tdarr_state.db}
      RUNTIME_SETTINGS_FILE: ${RUNTIME_SETTINGS_FILE:-/config/runtime_settings.json}
      SYNC_PROGRESS_FILE: ${SYNC_PROGRESS_FILE:-/config/sync_progress.json}
      LOG_FILE: ${LOG_FILE:-/logs/tdarr_sync.log}
      NEXT_BACKEND_ORIGIN: http://127.0.0.1:8000
    volumes:
      - ${SONARR_LIBRARY_MOUNT:-${HOST_LIBRARY_MOUNT}}:/media/library
      - ${RADARR_LIBRARY_MOUNT:-${HOST_LIBRARY_MOUNT}}:/media/radarr_library
      - ${HOST_TDARR_INPUT}:/media/tdarr/input
      - ${HOST_TDARR_OUTPUT}:/media/tdarr/output
      - ${HOST_ARCHIVE_DIR:-./archive}:/media/archive
      - ${TDARR_SYNC_CONFIG_DIR:-${TDARR_SYNC_DATA_DIR:-./data}}:/config
      - ${TDARR_SYNC_DATA_DIR:-./data}:/data
      - ${TDARR_SYNC_LOG_DIR:-./logs}:/logs
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).getcode() == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ghcr.io/warner-family-dev/tdarr_sync:${IMAGE_TAG:-latest}
    profiles:
      - manual
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SERVICE_MODE: worker
      STATE_DB_FILE: ${STATE_DB_FILE:-/config/sonarr_tdarr_state.db}
      RUNTIME_SETTINGS_FILE: ${RUNTIME_SETTINGS_FILE:-/config/runtime_settings.json}
      SYNC_PROGRESS_FILE: ${SYNC_PROGRESS_FILE:-/config/sync_progress.json}
      LOG_FILE: ${LOG_FILE:-/logs/tdarr_sync.log}
    volumes:
      - ${SONARR_LIBRARY_MOUNT:-${HOST_LIBRARY_MOUNT}}:/media/library
      - ${RADARR_LIBRARY_MOUNT:-${HOST_LIBRARY_MOUNT}}:/media/radarr_library
      - ${HOST_TDARR_INPUT}:/media/tdarr/input
      - ${HOST_TDARR_OUTPUT}:/media/tdarr/output
      - ${HOST_ARCHIVE_DIR:-./archive}:/media/archive
      - ${TDARR_SYNC_CONFIG_DIR:-${TDARR_SYNC_DATA_DIR:-./data}}:/config
      - ${TDARR_SYNC_DATA_DIR:-./data}:/data
      - ${TDARR_SYNC_LOG_DIR:-./logs}:/logs
    restart: "no"
